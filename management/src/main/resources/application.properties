#Application Configuration
spring.application.name=management
server.port=${SERVER_PORT}

#DB Configuration for MYSQL
spring.datasource.driver-class-name=${DB_DRIVER_CLASS}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#JPA Configuration
spring.jpa.database-platform=${DB_PLATFORM}
spring.jpa.generate-ddl=${GENERATE_DDL}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO}